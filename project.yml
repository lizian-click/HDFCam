name: HDFCam
options:
  bundleIdPrefix: com.hdfcam
  deploymentTarget:
    iOS: "17.0"
targets:
  HDFCam:
    type: application
    platform: iOS
    sources:
      - HDFCam
    info:
      path: HDFCam/Info.plist
      properties:
        CFBundleDisplayName: 柔光机
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: 用于实时预览和拍摄柔光效果照片
        NSPhotoLibraryAddUsageDescription: 用于把拍好的照片保存到相册
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hdfcam.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
